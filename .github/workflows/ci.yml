name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch Ballerina version metadata
        run: git -C packages/ballerina-wasm/ballerina fetch --unshallow --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/ballerina-wasm/go.mod
            packages/ballerina-wasm/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Test on Node.js
        run: bun run --filter @snelusha/balrun test:node

      - name: Install Chromium
        working-directory: packages/balrun
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Test in Chromium
        run: bun run --filter @snelusha/balrun test:browser
